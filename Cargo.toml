[package]
name = "onecode"
version = "0.1.0"
edition = "2021"
authors = ["Erik Garrison <erik.garrison@gmail.com>"]
description = "Rust bindings for ONEcode - a data representation format for genomic data"
repository = "https://github.com/pangenome/onecode-rs"
license = "MIT"
keywords = ["genomics", "bioinformatics", "onecode", "ffi"]
categories = ["science", "api-bindings"]
readme = "README.md"

[lib]
name = "onecode"
path = "src/lib.rs"

[features]
default = []
# Use bindgen to regenerate bindings at build time (requires libclang)
regenerate-bindings = ["bindgen"]

[dependencies]
libc = "0.2"

[build-dependencies]
cc = "1.0"
bindgen = { version = "0.70", optional = true }
